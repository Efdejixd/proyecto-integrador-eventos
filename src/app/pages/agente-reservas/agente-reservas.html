<section class="wrap"><h1>Administrar reservas</h1><div class="list">@for(r of reservas;track r.id){<article><div><b>{{cliente(r.clienteId)}}</b><p>{{evento(r.eventoId)}} · {{r.entradas}} entrada(s) · {{dinero(r.total)}}</p></div><div><span>{{r.estado}}</span>@if(r.estado==='Reservada'){<button (click)="confirmar(r)">Confirmar</button>}</div></article>}@empty{<p>No hay reservas para tus eventos todavía.</p>}</div></section>
