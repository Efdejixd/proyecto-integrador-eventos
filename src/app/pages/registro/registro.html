<div class="card"><h1>Crear cuenta de cliente</h1><form (ngSubmit)="guardar()">
<div class="grid"><label>Identificación<input [(ngModel)]="identificacion" name="identificacion" required></label><label>Nombre completo<input [(ngModel)]="nombre" name="nombre" required></label><label>Correo<input [(ngModel)]="email" name="email" type="email" required></label><label>Contraseña<input [(ngModel)]="password" name="password" type="password" minlength="6" required></label><label>Dirección<input [(ngModel)]="direccion" name="direccion" required></label><label>Ciudad<input [(ngModel)]="ciudad" name="ciudad" required></label><label>Teléfono<input [(ngModel)]="telefono" name="telefono" required></label></div>
@if(msg){<p class="msg">{{msg}}</p>}<button>Registrarme</button></form><p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p></div>
