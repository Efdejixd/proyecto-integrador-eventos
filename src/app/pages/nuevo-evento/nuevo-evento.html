<section class="card"><h1>Crear nuevo evento</h1><form (ngSubmit)="guardar()"><div class="grid">
<label>Código<input [(ngModel)]="codigo" name="codigo" required></label><label>Nombre<input [(ngModel)]="nombre" name="nombre" required></label><label>Teatro<input [(ngModel)]="teatro" name="teatro" required></label><label>Ciudad<input [(ngModel)]="ciudad" name="ciudad" required></label><label>Departamento<input [(ngModel)]="departamento" name="departamento" required></label><label>País<input [(ngModel)]="pais" name="pais" required></label><label>Inicio<input type="datetime-local" [(ngModel)]="fechaInicio" name="fechaInicio" required></label><label>Fin<input type="datetime-local" [(ngModel)]="fechaFin" name="fechaFin" required></label><label>Capacidad<input type="number" [(ngModel)]="capacidad" name="capacidad" required></label><label>Precio base<input type="number" [(ngModel)]="precioBase" name="precioBase" required></label><label>Estado<select [(ngModel)]="estado" name="estado"><option>Programado</option><option>En Boletería</option><option>En Vivo</option><option>Finalizado</option><option>Cancelado</option></select></label></div>
<label>Descripción<textarea [(ngModel)]="descripcion" name="descripcion"></textarea></label><label>Observaciones<textarea [(ngModel)]="observaciones" name="observaciones"></textarea></label><button>Guardar evento</button></form></section>
